
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Record Management System</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Connect the JavaScript file -->
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">

        <header class="page-header">
            <h1>Student Record Management System</h1>
            <p>Manage student details easily and efficiently.</p>
        </header>

        <!-- Student form section -->
        <section class="card">
            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">
                <div class="form-group">
                    <label for="rollNumber">Roll Number</label>
                    <input
                        type="text"
                        id="rollNumber"
                        placeholder="Enter roll number"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input
                        type="text"
                        id="department"
                        placeholder="e.g. MCA, BCA, CSE"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="button-group">
                    <button type="submit" id="submitButton">
                        Add Student
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="secondary-button"
                        hidden
                    >
                        Cancel Edit
                    </button>
                </div>

                <p id="message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <!-- Student records table -->
        <section class="card">
            <div class="table-heading">
                <h2>Student Records</h2>
                <span id="recordCount">Total Students: 0</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Roll Number</th>
                            <th>Student Name</th>
                            <th>Department</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                        <!-- JavaScript inserts student records here -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>Student Record Management System | HTML, CSS and JavaScript</p>
        </footer>

    </div>

</body>
</html>
